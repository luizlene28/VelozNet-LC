<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SEVERINO-LC | SpeedNet BMW Edition</title>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&display=swap" rel="stylesheet" />

    <style>
        :root {
            --blue-400: #00aaff;
            --blue-500: #0088dd;
            --blue-600: #0066cc;
            --cyan-400: #00d4ff;
            --cyan-300: #5ce0ff;
            --bg-deep: #06080d;
            --bg-card: rgba(16, 18, 24, 0.7);
            --border-subtle: rgba(255, 255, 255, 0.07);
            --border-glow: rgba(0, 180, 255, 0.3);
            --text-dim: rgba(255, 255, 255, 0.55);
            --text-mid: rgba(255, 255, 255, 0.8);
            --radius-xl: 28px;
            --radius-lg: 20px;
            --radius-md: 14px;
            --shadow-glow-blue: 0 0 40px rgba(0, 170, 255, 0.35);
            --shadow-glow-cyan: 0 0 50px rgba(0, 210, 255, 0.4);
            --shadow-inner-deep: inset 0 8px 32px rgba(0, 0, 0, 0.7);
            --transition-smooth: 0.35s cubic-bezier(0.25, 0.8, 0.25, 1.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Orbitron', sans-serif;
        }

        body {
            background: #020408;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            width: 650px;
            height: 650px;
            background: radial-gradient(circle, rgba(0, 150, 255, 0.18) 0%, transparent 68%);
            filter: blur(90px);
            top: -280px;
            right: -180px;
            animation: orbFloat1 10s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            width: 550px;
            height: 550px;
            background: radial-gradient(circle, rgba(0, 200, 255, 0.12) 0%, transparent 70%);
            filter: blur(100px);
            bottom: -260px;
            left: -160px;
            animation: orbFloat2 13s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes orbFloat1 {
            0%,
            100% {
                transform: translate(0, 0);
            }
            25% {
                transform: translate(40px, 35px);
            }
            50% {
                transform: translate(-20px, 55px);
            }
            75% {
                transform: translate(-45px, -20px);
            }
        }

        @keyframes orbFloat2 {
            0%,
            100% {
                transform: translate(0, 0);
            }
            33% {
                transform: translate(-35px, -30px);
            }
            66% {
                transform: translate(30px, -45px);
            }
        }

        .bg-grid {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            opacity: 0.025;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.4) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.4) 1px, transparent 1px);
            background-size: 60px 60px;
            mask: radial-gradient(ellipse at center, black 30%, transparent 70%);
        }

        .app {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 440px;
            background: rgba(14, 16, 22, 0.7);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-xl);
            padding: 28px 24px 24px;
            box-shadow:
                0 0 60px rgba(0, 160, 255, 0.2),
                0 20px 60px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.04);
            transform-style: preserve-3d;
            perspective: 1200px;
        }

        .logo {
            text-align: center;
            margin-bottom: 6px;
        }
        .logo h1 {
            font-size: 30px;
            font-weight: 900;
            letter-spacing: 4px;
            color: #fff;
            text-shadow: 0 0 25px rgba(0, 180, 255, 0.5);
        }
        .logo span {
            color: #00c8ff;
            text-shadow: 0 0 30px rgba(0, 200, 255, 0.7);
        }
        .sub {
            text-align: center;
            font-size: 11px;
            letter-spacing: 3px;
            opacity: 0.55;
            margin-bottom: 22px;
            color: #a0c8e8;
        }

        /* 3D Speedometer wrapper */
        .speedo-3d-wrapper {
            perspective: 900px;
            margin: 0 auto;
            width: 320px;
            height: 320px;
            position: relative;
        }

        .speedometer {
            position: relative;
            width: 320px;
            height: 320px;
            margin: auto;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at 45% 40%, #1a2030 0%, #0a0d15 45%, #030508 100%);
            box-shadow:
                0 0 0 8px rgba(20, 24, 35, 0.9),
                0 0 0 11px rgba(30, 36, 50, 0.6),
                0 0 0 14px rgba(20, 24, 35, 0.8),
                0 0 50px rgba(0, 170, 255, 0.35),
                0 15px 50px rgba(0, 0, 0, 0.6),
                inset 0 5px 30px rgba(0, 0, 0, 0.8),
                inset 0 1px 0 rgba(255, 255, 255, 0.03);
            transform: rotateX(8deg) rotateY(0deg);
            transform-style: preserve-3d;
            transition: transform 0.15s ease-out;
            cursor: default;
            will-change: transform;
            overflow: hidden; /* clips numbers if they overflow */
        }

        .speedometer:hover {
            transform: rotateX(6deg) rotateY(0deg);
        }

        /* Inner shadow ring for depth */
        .speedometer::before {
            content: '';
            position: absolute;
            inset: 18px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.04);
            box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.5);
            pointer-events: none;
            z-index: 3;
        }

        /* Glass dome reflection */
        .speedometer::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: radial-gradient(ellipse at 38% 32%,
                    rgba(255, 255, 255, 0.08) 0%,
                    rgba(255, 255, 255, 0.03) 15%,
                    transparent 40%,
                    rgba(0, 0, 0, 0.15) 70%,
                    rgba(0, 0, 0, 0.3) 100%);
            pointer-events: none;
            z-index: 80;
        }

        /* Extra inner vignette for depth impression */
        .inner-vignette {
            position: absolute;
            inset: 10px;
            border-radius: 50%;
            background: radial-gradient(circle at 50% 45%,
                    transparent 30%,
                    rgba(0, 0, 0, 0.35) 70%,
                    rgba(0, 0, 0, 0.7) 100%);
            pointer-events: none;
            z-index: 79;
            mix-blend-mode: multiply;
        }

        .tick-marks {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            z-index: 2;
            pointer-events: none;
        }

        .tick {
            position: absolute;
            left: 50%;
            top: 50%;
            transform-origin: center center;
            pointer-events: none;
        }
        .tick.major {
            width: 3px;
            height: 16px;
            background: rgba(255, 255, 255, 0.55);
            border-radius: 2px;
            margin-left: -1.5px;
            margin-top: -135px;
            box-shadow: 0 0 4px rgba(180, 220, 255, 0.3);
        }
        .tick.minor {
            width: 1.5px;
            height: 8px;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 1px;
            margin-left: -0.75px;
            margin-top: -135px;
        }

        .numbers {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            z-index: 4;
            pointer-events: none;
            overflow: visible; /* allow numbers to be placed precisely */
        }

        .num {
            position: absolute;
            font-size: 13px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.75);
            text-shadow: 0 0 10px rgba(180, 220, 255, 0.5), 0 0 2px rgba(0, 0, 0, 0.5);
            pointer-events: none;
            text-align: center;
            width: 30px;
            height: 18px;
            line-height: 18px;
            transform: translate(-50%, -50%); /* will be set via style */;
        }

        .arc {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(from 220deg,
                    rgba(0, 180, 255, 0.5),
                    rgba(0, 220, 255, 0.7),
                    rgba(180, 230, 255, 0.6),
                    rgba(0, 180, 255, 0.5));
            mask: radial-gradient(circle at center, transparent 61%, #000 62.5%);
            -webkit-mask: radial-gradient(circle at center, transparent 61%, #000 62.5%);
            opacity: 0.3;
            animation: spin 8s linear infinite;
            z-index: 1;
            pointer-events: none;
            filter: blur(1px);
        }
        .arc-glow {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(from 220deg,
                    transparent,
                    rgba(0, 200, 255, 0.5) 15%,
                    rgba(0, 220, 255, 0.7) 25%,
                    rgba(0, 200, 255, 0.5) 35%,
                    transparent 50%);
            mask: radial-gradient(circle at center, transparent 58%, #000 60%);
            -webkit-mask: radial-gradient(circle at center, transparent 58%, #000 60%);
            opacity: 0.5;
            animation: spin 8s linear infinite;
            z-index: 1;
            pointer-events: none;
            filter: blur(4px);
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        .pointer {
            position: absolute;
            width: 5px;
            height: 125px;
            background: linear-gradient(to top,
                    #1a1a2e 0%,
                    #3a4a5a 15%,
                    #8899aa 35%,
                    #dde8f0 50%,
                    #ffffff 55%,
                    #c8d8e8 65%,
                    #6a7a8a 85%,
                    #2a2a3a 100%);
            bottom: 50%;
            left: 50%;
            transform-origin: bottom center;
            transform: translateX(-50%) rotate(-130deg);
            border-radius: 3px 3px 1px 1px;
            box-shadow:
                3px 0 8px rgba(0, 0, 0, 0.5),
                -1px 0 4px rgba(255, 255, 255, 0.2),
                0 0 12px rgba(0, 180, 255, 0.4);
            z-index: 70;
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            clip-path: polygon(42% 0%, 58% 0%, 62% 8%, 55% 95%, 50% 100%, 45% 95%, 38% 8%);
        }
        .pointer::after {
            content: '';
            position: absolute;
            top: 3px;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 50px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 1px;
            filter: blur(1px);
        }

        .center-hub {
            position: absolute;
            width: 24px;
            height: 24px;
            background: radial-gradient(circle at 40% 35%,
                    #8899aa 0%,
                    #445566 30%,
                    #1a1a2e 60%,
                    #0a0a14 100%);
            border-radius: 50%;
            z-index: 90;
            box-shadow:
                0 3px 10px rgba(0, 0, 0, 0.6),
                0 0 0 3px rgba(20, 25, 35, 0.9),
                0 0 0 5px rgba(30, 36, 48, 0.5),
                0 0 15px rgba(0, 180, 255, 0.3);
            pointer-events: none;
        }
        .center-hub-inner {
            position: absolute;
            width: 10px;
            height: 10px;
            background: radial-gradient(circle at 45% 40%, #fff 0%, #aabbcc 40%, #445566 100%);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 91;
            box-shadow: 0 0 6px rgba(255, 255, 255, 0.5);
            pointer-events: none;
        }

        .center-info {
            position: absolute;
            text-align: center;
            z-index: 75;
            pointer-events: none;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            margin-top: 35px;
        }
        .speed-value {
            font-size: 52px;
            font-weight: 900;
            color: #fff;
            text-shadow:
                0 0 20px rgba(0, 190, 255, 0.7),
                0 0 50px rgba(0, 160, 255, 0.4),
                0 2px 4px rgba(0, 0, 0, 0.5);
            letter-spacing: 1px;
            line-height: 1;
        }
        .unit {
            font-size: 13px;
            opacity: 0.7;
            letter-spacing: 3px;
            color: #c0d8f0;
            margin-top: 2px;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-top: 28px;
            perspective: 800px;
        }
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            padding: 18px 14px;
            border-radius: var(--radius-lg);
            text-align: center;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow:
                0 8px 24px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.03);
            transition: var(--transition-smooth);
            transform-style: preserve-3d;
            cursor: default;
            position: relative;
            overflow: hidden;
        }
        .card::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at center,
                    rgba(255, 255, 255, 0.03) 0%,
                    transparent 60%);
            pointer-events: none;
            transition: opacity 0.4s;
            opacity: 0;
        }
        .card:hover {
            transform: translateY(-5px) rotateX(3deg) rotateY(-2deg);
            border-color: var(--border-glow);
            box-shadow:
                0 16px 36px rgba(0, 0, 0, 0.5),
                0 0 25px rgba(0, 170, 255, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }
        .card:hover::after {
            opacity: 1;
        }
        .card:active {
            transform: translateY(-2px) rotateX(1deg) rotateY(-1deg);
            transition: 0.1s ease;
        }
        .card-title {
            font-size: 11px;
            letter-spacing: 2px;
            opacity: 0.6;
            margin-bottom: 8px;
            color: #8ab8d8;
            text-transform: uppercase;
        }
        .card-value {
            font-size: 26px;
            font-weight: 800;
            color: #00d4ff;
            text-shadow: 0 0 18px rgba(0, 210, 255, 0.5);
            letter-spacing: 1px;
        }

        .buttons {
            margin-top: 22px;
            display: flex;
            gap: 14px;
            perspective: 600px;
        }
        button {
            flex: 1;
            padding: 16px;
            border: none;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 2px;
            cursor: pointer;
            transition: var(--transition-smooth);
            position: relative;
            overflow: hidden;
            transform-style: preserve-3d;
            text-transform: uppercase;
        }
        button::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .start {
            background: linear-gradient(145deg, #0090dd 0%, #0066cc 40%, #0044aa 100%);
            color: #fff;
            box-shadow:
                0 8px 24px rgba(0, 140, 255, 0.4),
                0 2px 6px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .start:hover {
            transform: translateY(-3px) rotateX(4deg);
            box-shadow:
                0 14px 32px rgba(0, 160, 255, 0.55),
                0 4px 10px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.25);
            background: linear-gradient(145deg, #00a0ee 0%, #0077dd 40%, #0055bb 100%);
        }
        .start:active {
            transform: translateY(1px) rotateX(1deg);
            box-shadow:
                0 4px 12px rgba(0, 140, 255, 0.35),
                0 1px 3px rgba(0, 0, 0, 0.3);
            transition: 0.08s ease;
        }
        .stop {
            background: #1a1d26;
            color: #ccd;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow:
                0 8px 20px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.03);
        }
        .stop:hover {
            transform: translateY(-3px) rotateX(4deg);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow:
                0 14px 28px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);
            background: #222630;
        }
        .stop:active {
            transform: translateY(1px) rotateX(1deg);
            transition: 0.08s ease;
        }

        .network {
            margin-top: 20px;
            padding: 15px 18px;
            border-radius: var(--radius-md);
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            text-align: center;
            font-size: 13px;
            letter-spacing: 1px;
            color: #a0c8e0;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .footer {
            margin-top: 16px;
            text-align: center;
            font-size: 10px;
            letter-spacing: 2px;
            opacity: 0.4;
            color: #8899aa;
        }

        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: scale(0);
            animation: rippleEffect 0.6s ease-out forwards;
            pointer-events: none;
        }
        @keyframes rippleEffect {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        /* Responsive */
        @media (max-width: 460px) {
            .app {
                padding: 20px 14px 18px;
                border-radius: 24px;
                max-width: 100%;
            }
            .speedometer {
                width: 260px;
                height: 260px;
                box-shadow:
                    0 0 0 6px rgba(20, 24, 35, 0.9),
                    0 0 0 9px rgba(30, 36, 50, 0.6),
                    0 0 0 12px rgba(20, 24, 35, 0.8),
                    0 0 35px rgba(0, 170, 255, 0.3),
                    0 10px 35px rgba(0, 0, 0, 0.6),
                    inset 0 4px 20px rgba(0, 0, 0, 0.8);
            }
            .speedo-3d-wrapper {
                width: 260px;
                height: 260px;
            }
            .tick.major {
                height: 12px;
                margin-top: -108px;
            }
            .tick.minor {
                height: 6px;
                margin-top: -108px;
            }
            .num {
                font-size: 10px;
                width: 26px;
                height: 14px;
                line-height: 14px;
            }
            .pointer {
                height: 100px;
            }
            .speed-value {
                font-size: 38px;
            }
            .center-info {
                margin-top: 28px;
            }
            .center-hub {
                width: 20px;
                height: 20px;
            }
            .center-hub-inner {
                width: 8px;
                height: 8px;
            }
            .stats {
                gap: 10px;
                margin-top: 20px;
            }
            .card {
                padding: 14px 10px;
                border-radius: 16px;
            }
            .card-value {
                font-size: 20px;
            }
            button {
                padding: 13px;
                font-size: 12px;
                letter-spacing: 1px;
            }
            .logo h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>

    <div class="bg-grid"></div>

    <div class="app">
        <div class="logo">
            <h1>Speed<span>Net</span></h1>
        </div>
        <div class="sub">BMW / AUDI PERFORMANCE EDITION</div>

        <div class="speedo-3d-wrapper" id="speedoWrapper">
            <div class="speedometer" id="speedometer">
                <div class="arc"></div>
                <div class="arc-glow"></div>
                <div class="tick-marks" id="tickMarks"></div>
                <div class="numbers" id="numbers"></div>
                <div class="pointer" id="pointer"></div>
                <!-- New vignette for depth -->
                <div class="inner-vignette"></div>
                <div class="center-hub"></div>
                <div class="center-hub-inner"></div>
                <div class="center-info">
                    <div class="speed-value" id="speed">0</div>
                    <div class="unit">Mbps</div>
                </div>
            </div>
        </div>

        <div class="stats">
            <div class="card" id="cardDownload">
                <div class="card-title">Download</div>
                <div class="card-value" id="download">0</div>
            </div>
            <div class="card" id="cardUpload">
                <div class="card-title">Upload</div>
                <div class="card-value" id="upload">0</div>
            </div>
            <div class="card" id="cardPing">
                <div class="card-title">Ping</div>
                <div class="card-value" id="ping">0</div>
            </div>
            <div class="card" id="cardJitter">
                <div class="card-title">Jitter</div>
                <div class="card-value" id="jitter">0</div>
            </div>
        </div>

        <div class="buttons">
            <button class="start" id="btnStart" onclick="acionarTesteRealNoKodular()">Iniciar</button>
            <button class="stop" id="btnStop" onclick="stopTest()">Parar</button>
        </div>

        <div class="network" id="network">📶 Rede: Detectando conexão...</div>
        <div class="footer">SEVERINO-LC • INTERNET PERFORMANCE SYSTEM</div>
    </div>

    <script>
       // === DOM Elements ===
        const pointer = document.getElementById("pointer");
        const speedText = document.getElementById("speed");
        const speedometer = document.getElementById("speedometer");
        const speedoWrapper = document.getElementById("speedoWrapper");
        const downloadEl = document.getElementById("download");
        const uploadEl = document.getElementById("upload");
        const pingEl = document.getElementById("ping");
        const jitterEl = document.getElementById("jitter");
        const networkEl = document.getElementById("network");
        const btnStart = document.getElementById("btnStart");
        const btnStop = document.getElementById("btnStop");
        const tickMarksContainer = document.getElementById("tickMarks");
        const numbersContainer = document.getElementById("numbers");

        let running = false;
        let currentSpeed = 0;
        let targetSpeed = 0;
        let animationId = null;
        let isMobile = false;

        function detectMobile() {
            return ('ontouchstart' in window || navigator.maxTouchPoints > 0 || window.matchMedia('(pointer: coarse)').matches);
        }
        isMobile = detectMobile();

        // Criação das marcas do painel
        function createDialMarks() {
            const speedoWidth = speedometer.offsetWidth || 320;
            const outerRadius = speedoWidth / 2 - 22;
            const tickMajorLength = speedoWidth > 280 ? 16 : 12;
            const tickMinorLength = speedoWidth > 280 ? 8 : 6;
            const numberRadius = outerRadius - tickMajorLength - 12;

            tickMarksContainer.innerHTML = '';
            numbersContainer.innerHTML = '';

            for (let i = 0; i <= 300; i += 10) {
                const angleDeg = -130 + (i / 300) * 260;
                const isMajor = i % 20 === 0;

                const tick = document.createElement('div');
                tick.className = isMajor ? 'tick major' : 'tick minor';
                tick.style.transform = `rotate(${angleDeg}deg)`;
                tick.style.marginTop = `-${outerRadius}px`;
                tick.style.height = isMajor ? `${tickMajorLength}px` : `${tickMinorLength}px`;
                tickMarksContainer.appendChild(tick);

                if (isMajor) {
                    const rad = (angleDeg - 90) * Math.PI / 180;
                    const nx = numberRadius * Math.cos(rad);
                    const ny = numberRadius * Math.sin(rad);

                    const num = document.createElement('div');
                    num.className = 'num';
                    num.textContent = i;
                    num.style.left = '50%';
                    num.style.top = '50%';
                    num.style.transform = `translate(calc(-50% + ${nx}px), calc(-50% + ${ny}px))`;
                    numbersContainer.appendChild(num);
                }
            }
        }

        function updateSpeedDisplay(val) {
            const clamped = Math.max(0, Math.min(300, val));
            if(speedText) speedText.textContent = Math.round(clamped);
            const rotation = -130 + (clamped / 300) * 260;
            if(pointer) pointer.style.transform = `translateX(-50%) rotate(${rotation}deg)`;
        }

        function animateSpeed() {
            if (!running && Math.abs(currentSpeed - targetSpeed) < 0.3) {
                currentSpeed = targetSpeed;
                updateSpeedDisplay(currentSpeed);
                animationId = null;
                return;
            }
            const diff = targetSpeed - currentSpeed;
            const easing = Math.abs(diff) > 40 ? 0.22 : 0.14;
            currentSpeed += diff * easing;
            updateSpeedDisplay(currentSpeed);
            animationId = requestAnimationFrame(animateSpeed);
        }

        function setTargetSpeed(val) {
            targetSpeed = Math.max(0, Math.min(300, val));
            if (!animationId) animationId = requestAnimationFrame(animateSpeed);
        }

        // ===============================================================
        // === FUNÇÃO RECEPTORA: RECEBE OS DADOS REAIS DO KODULAR ========
        // ===============================================================
        
        window.injetarVelocidadeReal = function(velocidade, download, upload, ping, jitter) {
            setTargetSpeed(parseFloat(velocidade) || 0);
            
            if(download && downloadEl) downloadEl.textContent = download;
            if(upload && uploadEl) uploadEl.textContent = upload;
            if(ping && pingEl) pingEl.textContent = Math.round(ping);
            if(jitter && jitterEl) jitterEl.textContent = jitter;
        };

        // Quando o usuário clicar em INICIAR no site, avisa o Kodular para disparar a extensão real
        function acionarTesteRealNoKodular() {
            if(downloadEl) downloadEl.textContent = "...";
            if(uploadEl) uploadEl.textContent = "...";
            if(pingEl) pingEl.textContent = "...";
            if(jitterEl) jitterEl.textContent = "...";
            setTargetSpeed(0);
            
            if (window.AppInventor) {
                window.AppInventor.setWebViewString("INICIAR_TESTE_REAL");
            }
        }

        if(btnStart) btnStart.addEventListener('click', function(e) { acionarTesteRealNoKodular(); });
        if(btnStop) btnStop.addEventListener('click', function(e) { 
            if (window.AppInventor) window.AppInventor.setWebViewString("PARAR_TESTE");
        });

        window.addEventListener('resize', () => createDialMarks());
        
        function init() {
            createDialMarks();
            updateSpeedDisplay(0);
            if(speedometer) speedometer.style.transform = 'rotateX(8deg) rotateY(0deg)';
        }

        init();
    </script>
</body>
</html>
